[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-builder"
version = "0.1.0"
description = "A small command-line tool for building and collecting Android APKs from Gradle projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "apk-builder contributors" }]
dependencies = [
    "Flask==2.3.2",
    "Werkzeug==2.3.6",
]

[project.scripts]
apk-builder = "apk_builder.cli:main"
apk-builder-server = "apk_builder.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]