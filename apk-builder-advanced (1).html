<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ APK Builder - Advanced</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 3px solid #f0f0f0;
      padding-bottom: 20px;
    }
    
    .header h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 5px;
    }
    
    .header p {
      color: #999;
      font-size: 12px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 13px;
    }
    
    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }
    
    input[type="text"]:focus,
    input[type="file"]:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
      background: #f9f9ff;
    }
    
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .btn-build {
      grid-column: 1 / -1;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    
    .btn-build:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
    }
    
    .btn-build:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-build.hidden {
      display: none;
    }
    
    .btn-secondary {
      padding: 10px;
      background: #f0f0f0;
      color: #333;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .status-box {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      animation: slideIn 0.3s ease;
    }
    
    .status-box.show {
      display: block;
    }
    
    .status-box.building {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      color: #1565C0;
    }
    
    .status-box.success {
      background: #d4edda;
      border-left: 4px solid #28a745;
      color: #155724;
    }
    
    .status-box.error {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      color: #721c24;
    }
    
    .status-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .status-text {
      font-size: 12px;
      line-height: 1.5;
    }
    
    .progress-section {
      display: none;
      margin-bottom: 15px;
    }
    
    .progress-section.show {
      display: block;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .progress-text {
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    
    .build-logs {
      display: none;
      background: #f5f5f5;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #333;
    }
    
    .build-logs.show {
      display: block;
    }
    
    .log-line {
      padding: 4px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .log-line:last-child {
      border-bottom: none;
    }
    
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .download-btn {
      padding: 12px;
      background: #00b894;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-top: 10px;
      transition: all 0.3s ease;
    }
    
    .download-btn:hover {
      background: #00a377;
      transform: translateY(-2px);
    }
    
    .info-box {
      background: #f0f7ff;
      border-left: 4px solid #667eea;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #333;
      line-height: 1.6;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      
      .header h1 {
        font-size: 22px;
      }
      
      .button-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>⚡ APK Builder</h1>
      <p>Source Code ZIP → APK Automatic Build</p>
    </div>
    
    <!-- Configuration Section -->
    <div class="section">
      <div class="section-title">🔧 Configuration</div>
      <label>Backend URL:</label>
      <input type="text" id="backendUrl" placeholder="https://apk-builder.replit.dev" value="https://apk-builder.replit.dev">
    </div>
    
    <!-- Upload Section -->
    <div class="section">
      <div class="section-title">📦 Source Code</div>
      <label>ZIP File:</label>
      <input type="file" id="sourceZip" accept=".zip">
      <div class="info-box">
        💡 <strong>ضروری:</strong> build.gradle, settings.gradle, src/ شامل ہونا چاہیے
      </div>
    </div>
    
    <!-- Project Details -->
    <div class="section">
      <div class="section-title">📝 Project Details</div>
      <label>Project Name (اختیاری):</label>
      <input type="text" id="projectName" placeholder="میری App">
    </div>
    
    <!-- Build Configuration -->
    <div class="section">
      <div class="section-title">⚙️ Build Settings</div>
      <div class="button-group">
        <button class="btn-secondary" id="releaseBtn" onclick="selectBuild('release')">📦 Release</button>
        <button class="btn-secondary" id="debugBtn" onclick="selectBuild('debug')">🐛 Debug</button>
      </div>
      <p style="font-size: 12px; color: #666;">Selected: <strong id="buildType">Release</strong></p>
    </div>
    
    <!-- Build Button -->
    <div class="section">
      <button class="btn-build" id="buildBtn" onclick="startBuild()">⚡ APK بنائیں</button>
    </div>
    
    <!-- Status Section -->
    <div class="section">
      <div class="status-box" id="statusBox">
        <div class="status-title" id="statusTitle">
          <span class="spinner" id="spinner"></span>
          <span id="statusText">تیاری میں...</span>
        </div>
        <div class="status-text" id="statusDetail"></div>
      </div>
    </div>
    
    <!-- Progress Section -->
    <div class="progress-section" id="progressSection">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    
    <!-- Build Logs -->
    <div class="section">
      <label>📋 Build Logs:</label>
      <div class="build-logs" id="buildLogs"></div>
    </div>
    
    <!-- Download Button -->
    <button class="download-btn hidden" id="downloadBtn" onclick="downloadAPK()">
      📥 APK Download کریں
    </button>
  </div>

  <script>
    let buildState = {
      isBuilding: false,
      buildId: null,
      downloadUrl: null,
      selectedBuild: 'release'
    };

    function selectBuild(type) {
      buildState.selectedBuild = type;
      document.getElementById('buildType').textContent = type === 'release' ? 'Release' : 'Debug';
      document.getElementById('releaseBtn').style.opacity = type === 'release' ? '1' : '0.5';
      document.getElementById('debugBtn').style.opacity = type === 'debug' ? '1' : '0.5';
    }

    function addLog(message) {
      const logsDiv = document.getElementById('buildLogs');
      logsDiv.classList.add('show');
      
      const line = document.createElement('div');
      line.className = 'log-line';
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsDiv.appendChild(line);
      
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function updateProgress(percent, text) {
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressText').textContent = text || percent + '%';
    }

    function showStatus(message, type) {
      const box = document.getElementById('statusBox');
      const title = document.getElementById('statusTitle');
      const detail = document.getElementById('statusDetail');
      
      box.classList.add('show');
      box.className = `status-box show ${type}`;
      
      if (type === 'building') {
        title.innerHTML = `<span class="spinner"></span><span>${message}</span>`;
      } else {
        title.innerHTML = message;
      }
      
      detail.textContent = '';
    }

    async function startBuild() {
      const file = document.getElementById('sourceZip').files[0];
      const url = document.getElementById('backendUrl').value;

      if (!file) {
        showStatus('❌ ZIP فائل منتخب کریں', 'error');
        return;
      }

      if (!url.trim()) {
        showStatus('❌ Backend URL ڈالیں', 'error');
        return;
      }

      buildState.isBuilding = true;
      document.getElementById('buildBtn').disabled = true;
      document.getElementById('buildBtn').classList.add('hidden');
      document.getElementById('downloadBtn').classList.add('hidden');
      document.getElementById('progressSection').classList.add('show');
      document.getElementById('buildLogs').innerHTML = '';

      addLog('APK build شروع ہو رہی ہے...');
      showStatus('🔨 APK بن رہا ہے...', 'building');
      updateProgress(20, '20% - فائل تیار');

      try {
        const formData = new FormData();
        formData.append('file', file);

        addLog('فائل backend کو بھیجی جا رہی ہے...');
        updateProgress(40, '40% - Gradle compile');

        const response = await fetch(`${url}/build`, {
          method: 'POST',
          body: formData
        });

        updateProgress(70, '70% - APK generate');
        const result = await response.json();

        if (result.status && result.status.includes('✅')) {
          addLog('✅ APK کامیابی سے بن گیا!');
          updateProgress(100, '100% - مکمل');
          
          buildState.buildId = result.build_id;
          buildState.downloadUrl = result.download_url;
          
          showStatus('✅ APK تیار ہے! Download کریں', 'success');
          document.getElementById('downloadBtn').classList.remove('hidden');
        } else {
          addLog(`❌ خرابی: ${result.error}`);
          showStatus(`❌ خرابی: ${result.error || 'معلوم نہیں'}`, 'error');
        }
      } catch (error) {
        addLog(`❌ خرابی: ${error.message}`);
        showStatus(`❌ خرابی: ${error.message}`, 'error');
      } finally {
        buildState.isBuilding = false;
        document.getElementById('buildBtn').disabled = false;
        document.getElementById('buildBtn').classList.remove('hidden');
      }
    }

    function downloadAPK() {
      if (!buildState.downloadUrl) {
        alert('❌ Download URL نہیں ملی');
        return;
      }

      const url = document.getElementById('backendUrl').value;
      window.location.href = `${url}${buildState.downloadUrl}`;
    }

    // Initialize
    selectBuild('release');
  </script>
</body>
</html>
